<form [formGroup]="artistForm" (ngSubmit)="onSubmit()">
  <label for="name">Nom du groupe:</label>
  <input id="name" type="text" formControlName="name" />

  <label for="photo">URL de l’image:</label>
  <input id="photo" type="text" formControlName="photo" placeholder="https://..." />

  <button type="submit" [disabled]="!artistForm.valid">Soumettre</button>
</form>
